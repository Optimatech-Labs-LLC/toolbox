# Drop inside the optimatechlabs.com <VirtualHost> if AllowOverride is off for the webroot.
<Directory /var/www/html/optimatechlabs.com/tools>
  Options -ExecCGI -Indexes
  <IfModule mod_php.c>
    php_flag engine off
  </IfModule>
  <IfModule mod_headers.c>
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src blob: data:; worker-src 'self' blob:; media-src blob:; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; webrtc 'block'"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Cross-Origin-Resource-Policy "same-origin"
  </IfModule>
</Directory>
